name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs of a pull request; every run of main completes.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `lake build` (the library and protoc-gen-connect-lean), then `lake test`
      # (the tests, the code in README.md, and the axioms of the theorems it
      # lists). On Linux, also checks that nothing in `Connect` rests on other
      # axioms: `lcProof` comes from `unsafeCast` in the two `unsafe`
      # definitions that implement `MessageInterceptor.box`, which proofs
      # cannot reach.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          axiom-audit: ${{ matrix.os == 'ubuntu-24.04' }}
          axiom-audit-allow: propext,Classical.choice,Quot.sound,lcProof
      - name: Build the examples and the benchmark
        run: lake build eliza-server eliza-client bench

  conformance:
    name: Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: conformance-server conformance-client
          test: false
      - name: Download the conformance runner
        run: ./scripts/download-conformance.sh
      - name: Server conformance
        run: >-
          .lake/tools/connectconformance --conf conformance/config.yaml --mode server
          -- .lake/build/bin/conformance-server
      - name: Client conformance
        run: >-
          .lake/tools/connectconformance --conf conformance/config.yaml --mode client
          -- .lake/build/bin/conformance-client
